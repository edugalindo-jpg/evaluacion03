server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: alumno-service

  datasource:
    url: "${ALUMNO_DB_URL:jdbc:mysql://localhost:3306/alumno_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: alumno-pool
      maximum-pool-size: 10
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.tecsup.asistencia.alumno: INFO

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:8083,http://127.0.0.1:8083}"
